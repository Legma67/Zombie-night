<style>
/* layout: full-bleed 3D canvas, HUD pinned to the four edges, menus as one centred sheet */
:root{

}

// which boss comes on a boss wave: the last wave of a mode brings the Schattenkönig, otherwise Faust and Hand take turns
function bossFor(w, mode) {
  if (mode.boss) { if (w % 10) return null; return mode.waves && w >= mode.waves ? 'king' : ['boss', 'ice', 'slime', 'lava', 'king'][(w / 10 - 1) % 5]; }
  if (w % 5) return null; if (mode.waves && w >= mode.waves) return 'king';
  if (!mode.waves) return ['boss', 'ice', 'slime', 'lava', 'boss', 'king'][(w / 5 - 1) % 6];
  if (mode.waves >= 25 && w === 20) return 'lava'; if (w === 15) return 'slime'; return (w / 5) % 2 ? 'boss' : 'ice';
}
